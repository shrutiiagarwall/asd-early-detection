name: CI — Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn imbalanced-learn shap matplotlib seaborn joblib pytest gradio

      - name: Run tests
        run: |
          pytest tests/test_pipeline.py tests/test_app.py -v --tb=short

      - name: Verify gitignore blocks model files
        run: |
          grep -q "*.pkl" .gitignore && echo "pkl blocked" || echo "pkl not blocked"
          grep -q "models/" .gitignore && echo "models/ blocked" || echo "models/ not blocked"