[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "asd-early-detection"
version         = "0.1.0"
description     = "Multi-age ASD screening ML pipeline with AQ-10, SHAP, and Gradio UI"
readme          = "README.md"
license         = {file = "LICENSE"}
requires-python = ">=3.9"
keywords        = ["autism", "ASD", "screening", "machine-learning", "AQ-10", "explainable-ai"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "gradio>=4.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "flake8>=6.0"]
onnx = ["skl2onnx>=1.16", "onnxruntime>=1.16"]

[project.scripts]
asd-app = "app.app:main"

[tool.black]
line-length    = 100
target-version = ["py39", "py311"]
exclude        = '''/(\.git|\.venv|build|dist)/'''

[tool.flake8]
max-line-length = 100
ignore          = ["E203", "W503", "E501"]
exclude         = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source  = ["src"]
omit    = ["tests/*", "app/*", "notebooks/*"]
